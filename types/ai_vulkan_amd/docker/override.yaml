# NOTE: This is where the overrides take place.
services:
  ide:
    devices:
      - /dev/dri
      - /dev/kfd
    environment:
      - AMD_VULKAN_ICD=RADV
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_NUM_GPU=999
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_SKIP_GPU_VALIDATION=0
      - OLLAMA_VULKAN=1
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
    group_add:
      - ${RENDER_GROUP_ID:-0}
      - ${VIDEO_GROUP_ID:-0}
    ports:
      - name: ollama
        target: ${OLLAMA_PORT:-11434}
        host_ip: 0.0.0.0
        protocol: tcp
        published: "${OLLAMA_PORT:-11434}"
        mode: host
      - name: ROCmPFX_server
        target: ${ROCMPFX_SERVER_PORT:-8080}
        host_ip: 0.0.0.0
        protocol: tcp
        published: "${ROCMPFX_SERVER_PORT:-8080}"
        mode: host
    post_start:
      - command: chown ${USER_NAME:-root}:${USER_NAME:-root} ${USER_HOME_DIR:-/root}/.ollama
        user: root
    volumes:
      - ollama_data:${USER_HOME_DIR}/.ollama
      - huggingface_cache:${USER_HOME_DIR}/.cache/huggingface
volumes:
  ollama_data:
  huggingface_cache:
